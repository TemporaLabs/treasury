name: ci

on:
  push:
    # 🔴 VERSION BRANCHES TOO, not just main. A pull_request run verifies a PR's head, never the
    # integrated tree it merges into; without a push trigger on the version branch, a merged branch
    # is only ever verified piecewise, and merging to main becomes CI's first look at the combined
    # content — which makes main the place you find out.
    branches: [main, 'v[0-9]*', 'release/v[0-9]*']
  pull_request:
  workflow_dispatch:
    inputs:
      attest:
        description: "auto = attest only where it can succeed (public repo, push); force = run the attestation step regardless, to prove the assertion goes red"
        type: choice
        options: [auto, force]
        default: auto

# 🔴 Read-only at workflow level ON PURPOSE. The attestation identity (`id-token: write`,
# `attestations: write`) lives on the `attest` job below and nowhere else: that job runs no npm, no
# tests, no dependency code, and checks out with `persist-credentials: false`. Granting it here
# would hand the OIDC request token to every step of `check` — including `npm ci`'s lifecycle
# scripts — so a compromised dependency could mint an attestation under this workflow's identity
# for any bytes it likes (found in review).
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      packages: ${{ steps.pk.outputs.present }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # 🔴 Nothing else validates workflow SYNTAX, and the failure is silent: GitHub refuses to
      # load an unparseable workflow and simply never shows it, so a broken file looks exactly
      # like a workflow that was not triggered. Caught live — a `: ` inside an unquoted one-line
      # `run:` made publish.yml unparseable while every other check in this file stayed green.
      - name: workflows — every .github/workflows/*.yml parses
        run: |
          python3 - <<'PY'
          import pathlib, sys, yaml
          bad = []
          for f in sorted(pathlib.Path(".github/workflows").glob("*.y*ml")):
              try:
                  yaml.safe_load(f.read_text())
              except Exception as e:
                  bad.append(f"{f}: {e}")
          print("\n".join(bad) or "all workflows parse")
          sys.exit(1 if bad else 0)
          PY
      - name: docs — every relative link in docs/ resolves
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          bad = []
          for md in pathlib.Path("docs").rglob("*.md"):
              for m in re.finditer(r"\]\(([^)#:]+?)(?:#[^)]*)?\)", md.read_text()):
                  target = (md.parent / m.group(1)).resolve()
                  if not target.exists(): bad.append(f"{md}: {m.group(1)}")
          print("\n".join(bad) or "all docs links resolve")
          sys.exit(1 if bad else 0)
          PY
      # The install instructions pin a version on purpose (an immutable publish cannot drift); the
      # cost is prose pins nothing tied to a release. Script + proof in .github/scripts.
      # On main (a push, or a pull request into it) the pins must name package.json's version: the
      # release pull request moves them, because the plugin installs from the release tag and a
      # tagged tree whose docs named the previous version would send every reader to a tree without
      # this release in it. Between the merge and the tag the docs name a version not yet tagged or
      # published; that window is the maintainer's to close (docs/release-process.md), so here it
      # is a warning, not a failure.
      # On a release branch the docs legitimately lag package.json until the release pull request
      # moves them, so only their agreement with each other is checked there.
      - name: documentation pins ONE version — and on main, package.json's
        env:
          TARGET: ${{ github.base_ref || github.ref_name }}
        run: |
          if [ "$TARGET" = "main" ]; then
            bash .github/scripts/version-pins.sh --package-version
            git fetch -q --depth=1 origin '+refs/tags/*:refs/tags/*' || echo "::warning::tag fetch failed"
            v=$(node -p 'require("./package.json").version')
            if ! git rev-parse -q --verify "refs/tags/v${v}" >/dev/null; then
              echo "::warning::the documentation names ${v}, which has no v${v} tag yet — tag and publish it (docs/release-process.md)"
            fi
          else
            echo "${TARGET}: pins must agree with each other"
            bash .github/scripts/version-pins.sh
          fi
      - name: the version-pin gate can still go red (24 offline cases)
        run: bash .github/scripts/version-pins.test.sh
      # The decision lives in .github/scripts/detect-package.sh, with a case-driven proof beside
      # it — it gates most of this job's steps plus the whole `attest` job, and it has been wrong twice.
      - name: detect packages (a documents-only version branch has none — a MOVED one is an error)
        id: pk
        run: |
          present="$(bash .github/scripts/detect-package.sh)"
          echo "packages present: $present" >> "$GITHUB_STEP_SUMMARY"
          echo "present=$present" >> "$GITHUB_OUTPUT"
      - name: the package detector can still go red (13 offline cases)
        run: bash .github/scripts/detect-package.test.sh
        # The Claude Code plugin ships from plugin/ in this repository; its skill is
        # plugin/skills/earn/SKILL.md. A tree that declares the plugin must carry the skill, so its
        # absence there is a failure, never a skip. A documents-only version branch declares
        # neither, and has nothing to check.
      - name: does this tree carry the skill?
        id: sk
        run: |
          if [ -f plugin/skills/earn/SKILL.md ]; then echo "present=yes" >> "$GITHUB_OUTPUT"
          elif [ -f plugin/.claude-plugin/plugin.json ]; then echo "::error file=plugin/.claude-plugin/plugin.json::the plugin is declared but plugin/skills/earn/SKILL.md is missing"; exit 1
          else echo "present=no" >> "$GITHUB_OUTPUT"; fi
          echo "skill present: $([ -f plugin/skills/earn/SKILL.md ] && echo yes || echo no)" >> "$GITHUB_STEP_SUMMARY"
      # plugin/ is what a Claude Code install copies. Every file in it that also exists at the root is
      # a copy made by `npm run build` in the same commit, so the check is byte identity against this
      # tree: no release pin, nothing fetched. 🔴 It runs BEFORE `npm ci` and the build ON PURPOSE: the
      # build rewrites these copies, so a check after it reads the build's output, not the commit, and
      # a commit that deleted a copy would pass. It also pins the plugin's layout (marketplace source,
      # launch target) and refuses a lockfile or a symlink in plugin/.
      - name: the plugin folder carries exactly this commit's files
        if: steps.pk.outputs.present == 'yes'
        run: bash scripts/sync-plugin.sh --check
      - name: the declared version follows the version branch (release/v0.1.0 ⇒ 0.1.0)
        # The convention was set by hand; this holds it. A PR into vX.Y.Z, or a push to it,
        # fails if package.json declares anything else.
        # main and feature branches are not checked — the version belongs to the cycle, not the PR.
        env:
          TARGET: ${{ github.base_ref || github.ref_name }}
        run: |
          case "$TARGET" in release/v[0-9]*.[0-9]*.[0-9]*|v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "not a version branch ($TARGET) — skipped"; exit 0 ;; esac
          want="${TARGET#release/}"; want="${want#v}"
          fail=0
          for f in package.json; do
            got=$(node -e 'const j=require(process.argv[1]); const v=j.version; process.stdout.write(String(v))' "./$f")
            if [ "$got" != "$want" ]; then echo "::error file=$f::declares $got but the branch is $TARGET — bump it"; fail=1; else echo "$f: $got ok"; fi
          done
          exit $fail
      - run: npm ci
        if: steps.pk.outputs.present == 'yes'
      - run: npm run typecheck
        if: steps.pk.outputs.present == 'yes'
      - name: unit tests (no RPC in CI; live/fork tiers skip themselves)
        if: steps.pk.outputs.present == 'yes'
        run: npm test
      - name: skill spec validation (skill-creator quick_validate)
        if: steps.pk.outputs.present == 'yes' && steps.sk.outputs.present == 'yes'
        run: |
          git clone --depth 1 https://github.com/anthropics/claude-plugins-official /tmp/cpo
          python3 /tmp/cpo/plugins/skill-creator/skills/skill-creator/scripts/quick_validate.py plugin/skills/earn
          python3 /tmp/cpo/plugins/skill-creator/skills/skill-creator/scripts/quick_validate.py connect-plugin/skills/connect
      - name: bundled MCP server is current, and so are the plugin's copies of it
        if: steps.pk.outputs.present == 'yes'
        run: |
          npm run build
          git diff --exit-code --stat -- dist/mcp-server.mjs \
            || { echo "::error::dist/mcp-server.mjs is stale — run npm run build and commit it"; exit 1; }
          git diff --exit-code --stat -- THIRD_PARTY_NOTICES.md \
            || { echo "::error::THIRD_PARTY_NOTICES.md is stale — run npm run build and commit it"; exit 1; }
          git diff --exit-code --stat -- dist/connect-server.mjs CONNECT_THIRD_PARTY_NOTICES.md \
            || { echo "::error::dist/connect-server.mjs or CONNECT_THIRD_PARTY_NOTICES.md is stale — run npm run build and commit them"; exit 1; }
          # Only the files the build WRITES into plugin/; the manifests and the skill there are edited by hand.
          # `git status`, not `git diff`: a copy the commit deleted comes back UNTRACKED, which diff ignores.
          stale=$(git status --porcelain -- plugin/dist plugin/registry plugin/LICENSE plugin/NOTICE plugin/THIRD_PARTY_NOTICES.md plugin/package.json connect-plugin/dist connect-plugin/LICENSE connect-plugin/NOTICE connect-plugin/THIRD_PARTY_NOTICES.md connect-plugin/package.json)
          [ -z "$stale" ] || { echo "$stale"; echo "::error::plugin/ and connect-plugin/ copies are stale or missing — run npm run build and commit them"; exit 1; }
      # ── Licensing (Apache-2.0). An npm tarball takes what `files` publishes, and a plugin install
      # takes plugin/, so the licence, its NOTICE and the dependency notices must travel INSIDE both.
      # ───────────────────────────────────────────────────────────────────────────────────────────
      - name: the packed artifact ships LICENSE, NOTICE and the third-party notices
        if: steps.pk.outputs.present == 'yes'
        run: |
          npm pack --dry-run --json --ignore-scripts > /tmp/pack.json
          node -e '
            const files = new Set(require("/tmp/pack.json")[0].files.map((f) => f.path));
            const need = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "dist/mcp-server.mjs"];
            const missing = need.filter((f) => !files.has(f));
            if (missing.length) { console.log("::error file=package.json::the packed artifact is missing " + missing.join(", ")); process.exit(1); }
            console.log("packed artifact carries " + need.join(", "));
          '
      # ── Bundle provenance: the offline proof lives here; the attestation itself is the `attest`
      # job below, which runs no dependency code (see the `permissions:` note at the top). ──────
      - name: attestation gate — offline proof that the assertion can go red (12 cases)
        if: steps.pk.outputs.present == 'yes'
        run: bash .github/scripts/attestation-gate.test.sh
      - name: package.json `repository` names the PUBLIC repo (npm provenance needs the source repo to match where it publishes from)
        if: steps.pk.outputs.present == 'yes'
        run: |
          # The public repository is the only one that publishes, so this is the only URL provenance
          # can accept. A fork or mirror of this tree passes here too; only the public repository
          # publishes. The attest job is where the match is proven for real.
          got=$(node -e 'const j=require("./package.json"); process.stdout.write(String(j.repository?.url ?? ""))')
          want="git+https://github.com/TemporaLabs/treasury.git"
          [ "$got" = "$want" ] || { echo "::error file=package.json::repository.url is '$got' but the public repository is TemporaLabs/treasury — an npm publish with provenance from anywhere else will be refused"; exit 1; }
          echo "repository.url names the public repository"
      - name: bundled server answers tools/list with no sign/send tool
        if: steps.pk.outputs.present == 'yes'
        run: |
          python3 - <<'PY'
          import json, subprocess
          p = subprocess.Popen(["node","dist/mcp-server.mjs"], stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True)
          def send(o): p.stdin.write(json.dumps(o)+"\n"); p.stdin.flush()
          send({"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}); p.stdout.readline()
          send({"jsonrpc":"2.0","method":"notifications/initialized"})
          send({"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}})
          tools = json.loads(p.stdout.readline())["result"]["tools"]
          names = [t["name"] for t in tools]
          print(names)
          assert set(names) == {"earn_vaults","earn_terms","earn_quote","earn_status","earn_prepare_deposit","earn_prepare_withdraw","earn_balance","earn_claim"}, names
          assert not any(k in n for n in names for k in ("sign","send","transfer")), "a signing tool leaked in"
          # EXACT property set per tool, re-derived from the live bundle — not a superset or a
          # membership check (an earlier version would let a stray extra
          # property through on the six tools it did not name).
          props = {t["name"]: set((t.get("inputSchema") or {}).get("properties", {})) for t in tools}
          expected = {
              "earn_vaults": set(),
              "earn_terms": set(),
              "earn_status": {"vault", "account", "amount_usdc"},
              "earn_quote": {"vault", "account", "amount_usdc", "direction"},
              "earn_prepare_deposit": {"vault", "account", "amount_usdc", "receiver"},
              "earn_prepare_withdraw": {"vault", "receiver", "account", "amount_usdc", "all", "shares_exact"},
              "earn_balance": {"vault", "account", "lookback_blocks", "max_log_requests"},
              "earn_claim": {"receipt_id"},
          }
          assert props == expected, {k: (sorted(props.get(k, [])), sorted(v)) for k, v in expected.items() if props.get(k) != v}
          for old in ("depositor", "principal", "owner"):
              leaked = [n for n, pr in props.items() if old in pr]
              assert not leaked, f"{old!r} survives in {leaked}"
          p.stdin.close(); p.wait(5)
          PY
      - name: SKILL.md's tool table matches the server's real tools/list
        if: steps.pk.outputs.present == 'yes' && steps.sk.outputs.present == 'yes'
        run: |
          python3 - <<'PY'
          import json, re, subprocess, pathlib, sys
          # The copy the plugin actually runs, not the root bundle: a later step holds the two
          # identical, and this one checks the skill against what an install executes.
          p = subprocess.Popen(["node","plugin/dist/mcp-server.mjs"], stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True)
          def send(o): p.stdin.write(json.dumps(o)+"\n"); p.stdin.flush()
          send({"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}); p.stdout.readline()
          send({"jsonrpc":"2.0","method":"notifications/initialized"})
          send({"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}})
          live = {t["name"] for t in json.loads(p.stdout.readline())["result"]["tools"]}
          p.stdin.close(); p.wait(5)
          md = pathlib.Path("plugin/skills/earn/SKILL.md").read_text()
          # ANCHORED ON THE TOOL TABLE'S FIRST COLUMN ONLY. A free prose scan had
          # both failure modes: a forward-looking sentence ("future work may add `earn_transfer`")
          # read as a phantom tool, and an unbackticked or call-style mention
          # (`earn_balance(vault, account)`) extracted nothing at all and read as undocumented.
          # The table is the contract; prose is not.
          # ⚠️ PLAIN-TEXT CONTRACT for the table's first column: it must be exactly
          #    | `tool_name` | … |   — no bold, no icon, no leading indent. A reviewer measured that
          #    all three produce FALSE NEGATIVES (a documented tool reads as undocumented). That is
          #    the safe direction — a spurious CI failure asks a person to look, rather than passing
          #    silently — but it is invisible from reading the regex, so it is stated here.
          documented = set(re.findall(r"^\|\s*`(earn_[a-z_]+)`", md, re.M))
          missing = live - documented
          phantom = documented - live
          print("live:", sorted(live)); print("documented:", sorted(documented))
          if missing: print("::error::SKILL.md never mentions:", sorted(missing))
          if phantom: print("::error::SKILL.md names tools the server does not have:", sorted(phantom))
          sys.exit(1 if (missing or phantom) else 0)
          PY
      - name: the connect plugin's server exposes exactly its five tools, and SKILL.md documents them
        if: steps.pk.outputs.present == 'yes'
        run: |
          python3 - <<'PY'
          import json, re, subprocess, pathlib, sys
          # The copy the connect plugin actually runs, not the root bundle.
          p = subprocess.Popen(["node","connect-plugin/dist/connect-server.mjs"], stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True)
          def send(o): p.stdin.write(json.dumps(o)+"\n"); p.stdin.flush()
          send({"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}); p.stdout.readline()
          send({"jsonrpc":"2.0","method":"notifications/initialized"})
          send({"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}})
          live = {t["name"] for t in json.loads(p.stdout.readline())["result"]["tools"]}
          p.stdin.close(); p.wait(5)
          assert live == {"connect_status","connect_wallet","disconnect_wallet","switch_wallet","connect_send_transaction"}, sorted(live)
          md = pathlib.Path("connect-plugin/skills/connect/SKILL.md").read_text()
          documented = set(re.findall(r"^\|\s*`([a-z_]+)`", md, re.M))
          if live != documented: print("::error::SKILL.md tool table differs from the server:", sorted(live ^ documented)); sys.exit(1)
          PY
      # A package.json version is a RUNTIME value: the bundle reports the one beside it as
      # serverInfo.version, and the manifests are what the marketplaces advertise.
      - name: every declaration of this repository's own version agrees
        if: steps.pk.outputs.present == 'yes'
        run: bash scripts/check-versions.sh
      - name: the licence and NOTICE say what they must
        if: steps.pk.outputs.present == 'yes'
        run: |
          node - <<'JS'
          const { createHash } = require("node:crypto");
          const { readFileSync, statSync } = require("node:fs");
          const sha = (b) => createHash("sha256").update(b).digest("hex");
          const norm = (t) => t.replace(/\s+/g, " ").trim();
          // The licence is pinned by its TEXT, not its bytes. The repository's LICENSE is
          // GitHub's licence-picker template: 11,357 bytes, sha256 c71d239d…, which differs
          // from the canonical file at apache.org (11,358 bytes, sha256 cfc7749b…) by a single
          // leading newline. Same licence, laid out differently — measured against apache.org
          // directly rather than against our own comment about it.
          //
          // A byte pin would buy one property: a stranger verifies with `diff` and no normaliser.
          // It would also mean this gate rejecting the file the repository's owner put there, so
          // the pin is the thing that gives way. CANONICAL below still proves it is Apache-2.0
          // word for word, which is the property that actually matters for a licence.
          const CANONICAL = "0ffddef9e48f8a09aed5caf2d44f7ba1c1be2d9b8e0a6f693b1635b2d5566645";
          const fail = [];
          const licence = readFileSync("LICENSE", "utf8");
          // ⚠️ THIS IS A DIAGNOSTIC, NOT A GUARD, AND IT CANNOT FIRE WHILE CANONICAL IS BELOW IT.
          // CANONICAL pins one exact normalised string, and that string contains "Apache License",
          // so anything passing CANONICAL contains it too. Its only job is a readable error: an MIT
          // file fails here with "does not name the Apache License" rather than with the less
          // obvious "not the canonical text". If CANONICAL is ever dropped or weakened, THIS LINE
          // WILL LOOK LIKE A SURVIVING GUARD AND WILL NOT BE ONE — a substring check passes on any
          // document that merely quotes the licence's name.
          if (!licence.includes("Apache License")) fail.push("LICENSE does not name the Apache License");
          if (sha(norm(licence)) !== CANONICAL) fail.push("LICENSE is not the canonical Apache-2.0 text");
          if (/TRADEMARKS\.md/.test(licence)) fail.push("LICENSE references TRADEMARKS.md, which no longer ships");
          const notice = readFileSync("NOTICE", "utf8");
          if (!norm(notice).includes("section 6")) fail.push("NOTICE does not withhold the names by citing section 6");
          if (!/^Copyright 2026 Tempora Labs/m.test(notice)) fail.push("NOTICE carries no copyright line");
          // Not vacuous: the notices file must actually carry the bundled dependencies' licences, so an
          // emptied or placeholder file fails instead of passing.
          const notices = readFileSync("THIRD_PARTY_NOTICES.md", "utf8");
          if (statSync("THIRD_PARTY_NOTICES.md").size < 5000) fail.push("THIRD_PARTY_NOTICES.md is too small to be the real notices");
          if (!/MIT|Apache/.test(notices)) fail.push("THIRD_PARTY_NOTICES.md names no dependency licence");
          if (fail.length) { for (const f of fail) console.log("::error::" + f); process.exit(1); }
          console.log("LICENSE is the canonical Apache-2.0 text; NOTICE and the third-party notices say what they must");
          JS

  # ── Bundle provenance ──────────────────────────────────────────────────────────────────────────
  # This job attests the COMMITTED root dist/mcp-server.mjs. A marketplace install runs
  # plugin/dist/mcp-server.mjs, which the plugin-folder step holds byte-identical to it in the
  # committed tree, so the same attestation verifies the installed copy by digest (git install, no npm). `check` proved, on this same commit, that the committed bundle equals a
  # rebuild of the committed source (its stale-dist step) — `needs: check` is what carries that
  # across. This job attests THAT file with GitHub's OIDC identity and verifies it back, so a
  # stranger can later run `gh attestation verify` on the file in their plugin cache and get the
  # commit and workflow that attested it (docs/runbooks/verify_the_bundle.md).
  #
  # This job deliberately runs NOTHING but checkout, the gate, the attest action, `gh`, and bash:
  # no `npm ci`, no tests, no tsx. Credentials are not persisted into .git/config. The attestation
  # identity is granted here and only here.
  #
  # 🔴 Artifact attestations are only issued for PUBLIC repositories, so on a private
  # fork or mirror the attest step cannot succeed: the gate SKIPS it there and
  # REQUIRES it on the public repo. A step that passes by skipping renders identically to one that
  # worked, which is why the last step asserts the recorded outcomes against the gate's decision —
  # and why `workflow_dispatch` with attest=force exists: it runs the step here, where GitHub refuses
  # it, and the assertion goes red. That red is the proof the assertion can fire.
  attest:
    needs: check
    if: needs.check.outputs.packages == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: attestation gate — decide
        id: gate
        env:
          REPO_VISIBILITY: ${{ github.event.repository.visibility }}
          EVENT_NAME: ${{ github.event_name }}
          ATTEST_INPUT: ${{ github.event.inputs.attest }}
        run: bash .github/scripts/attestation-gate.sh decide
      - name: attest the committed bundle (SLSA build provenance, GitHub OIDC identity)
        id: attest
        if: steps.gate.outputs.attest != 'skip'
        continue-on-error: true   # the assert step below turns a failure here into the job's red, with the reason
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/mcp-server.mjs
          show-summary: true
      - name: verify the attestation against the committed bundle (what a stranger runs)
        id: verify
        if: steps.gate.outputs.attest != 'skip'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          set -euo pipefail
          f=dist/mcp-server.mjs
          gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" --format json > /tmp/verify.json
          # the subject digest inside the verified attestation must be the digest of the file on disk
          # NOW — a dist edited after the attest step must not verify
          want=$(sha256sum "$f" | cut -d' ' -f1)
          vd=$(python3 -c 'import json; r=json.load(open("/tmp/verify.json")); r=r if isinstance(r,list) else [r]; print(r[0]["verificationResult"]["statement"]["subject"][0]["digest"]["sha256"])')
          [ "$vd" = "$want" ] || { echo "::error::attested digest $vd != file digest $want"; exit 1; }
          echo "verified: $f sha256=$want, attested by $GITHUB_REPOSITORY/.github/workflows/ci.yml ($ATTESTATION_URL)"
      - name: attestation gate — assert the outcomes match the decision (never a silent skip)
        if: always()
        env:
          REPO_VISIBILITY: ${{ github.event.repository.visibility }}
          EVENT_NAME: ${{ github.event_name }}
          ATTEST_INPUT: ${{ github.event.inputs.attest }}
          ATTEST_OUTCOME: ${{ steps.attest.outcome }}
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: bash .github/scripts/attestation-gate.sh assert
