name: DCO

# Every non-merge commit on a pull request must carry a Signed-off-by trailer matching its author,
# per CONTRIBUTING.md. Runs on every repository this workflow ships to, not only after a public
# release: the sign-off habit starts with the first contributor under the rule, not at publication.
#
# The check reads the commits from git (.github/scripts/dco-check.sh). It used to hand the whole
# commit list to an action through a `with:` input, and Linux caps one environment string at
# 128 KiB: past roughly 28 commits the action crashed with "Argument list too long" before it had
# evaluated a single sign-off, and the first release pull request sat red for a reason that had
# nothing to do with sign-offs. Semantics are unchanged: a two-parent merge commit (the shape
# GitHub's merge button produces) is exempt, a bot-authored commit is exempt, everything else must
# be signed off by its author or committer.
#
# Every run first proves the checker can fail (dco-check.test.sh), because a gate that only ever
# prints green is indistinguishable from one that stopped checking.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    name: DCO
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: the checker discriminates (fails on an unsigned commit, exempts a merge)
        run: bash .github/scripts/dco-check.test.sh

      - name: every non-merge commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$BASE"
          bash .github/scripts/dco-check.sh "$BASE" "$HEAD"
